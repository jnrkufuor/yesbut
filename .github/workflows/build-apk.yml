name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platforms + apply overlay
        run: ./tool/setup_platforms.sh

      - name: Build release APK
        run: flutter build apk --release --dart-define=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }} --dart-define=OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}

      - name: Build per-device APKs (smaller downloads)
        run: flutter build apk --release --split-per-abi --dart-define=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }} --dart-define=OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/YesBut-universal.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/YesBut.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/YesBut-older-phones.apk
          ls -la dist

      - name: Upload APKs (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: YesBut-apk
          path: dist/*.apk

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" dist/*.apk \
            --title "YesBut build ${{ github.run_number }}" \
            --notes "Install **YesBut.apk** on any recent Android phone (2017+). Use YesBut-older-phones.apk for very old 32-bit devices, or YesBut-universal.apk if unsure." \
            --latest

      - name: Unit tests (rule engine)
        run: flutter test
        continue-on-error: true

      - name: Static analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

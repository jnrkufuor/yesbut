name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Keep Gradle and its downloads between runs, so a flaky download
      # server can't break a build that worked before.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
            ~/gradle-dl
          key: gradle-${{ runner.os }}-${{ hashFiles('pubspec.lock', 'pubspec.yaml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Generate platforms + apply overlay
        run: ./tool/setup_platforms.sh

      - name: Use download mirrors
        run: ./tool/ci_mirrors.sh

      - name: Build release APK (retries if downloads time out)
        env:
          GRADLE_OPTS: -Dorg.gradle.internal.http.connectionTimeout=180000 -Dorg.gradle.internal.http.socketTimeout=180000 -Dorg.gradle.internal.repository.max.retries=8 -Dorg.gradle.internal.repository.initial.backoff=3000
        run: |
          for i in 1 2 3 4 5; do
            flutter build apk --release --dart-define=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }} --dart-define=OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }} 2>&1 | tee build.log
            [ "${PIPESTATUS[0]}" = 0 ] && exit 0
            # A code error won't fix itself; only retry download trouble.
            grep -qE '\.dart:[0-9]+:[0-9]+: Error' build.log && exit 1
            echo "Build attempt $i failed; waiting before retry"; sleep $((i * 45))
          done
          exit 1

      - name: Build per-device APKs (smaller downloads)
        env:
          GRADLE_OPTS: -Dorg.gradle.internal.repository.max.retries=8 -Dorg.gradle.internal.repository.initial.backoff=3000
        run: |
          for i in 1 2 3; do
            flutter build apk --release --split-per-abi --dart-define=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }} --dart-define=OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }} && exit 0
            sleep 45
          done
          exit 1

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/YesBut-universal.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/YesBut.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/YesBut-older-phones.apk
          ls -la dist

      - name: Upload APKs (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: YesBut-apk
          path: dist/*.apk

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" dist/*.apk \
            --title "YesBut build ${{ github.run_number }}" \
            --notes "Install **YesBut.apk** on any recent Android phone (2017+). Use YesBut-older-phones.apk for very old 32-bit devices, or YesBut-universal.apk if unsure." \
            --latest

      - name: Unit tests (rule engine)
        run: flutter test
        continue-on-error: true

      - name: Static analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true
